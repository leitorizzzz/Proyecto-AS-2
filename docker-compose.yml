# Infraestructura completa — Sistema Asilo "Cabeza de Algodon"
#
# Levanta SQL Server + los 7 microservicios (auth, pacientes, farmacia,
# laboratorio, financiero, reportes, notificaciones) + frontend nginx.
#
# Uso:
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f auth-service
#   docker compose down          (conserva los datos)
#   docker compose down -v       (BORRA la base de datos)
#
# Las variables MSSQL_SA_PASSWORD y JWT_SECRET se leen del archivo .env de
# esta misma carpeta (no versionado). Ver .env.example.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: asilo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?falta MSSQL_SA_PASSWORD en el .env de la raiz}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Crea la base de datos compartida y termina. Los microservicios crean sus
  # propias TABLAS al arrancar (inicializarEsquema), pero ninguno crea la
  # BASE, y app.js hace process.exit(1) si no puede conectarse. Sin este paso
  # un servidor limpio nunca arranca.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: asilo-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF NOT EXISTS (SELECT 1 FROM sys.databases WHERE name='AsiloCabezaAlgodon')
        CREATE DATABASE AsiloCabezaAlgodon;"
    restart: "no"

  auth-service:
    build: ./auth-service
    container_name: asilo-auth-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET en el .env de la raiz}
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    restart: unless-stopped

  farmacia-service:
    build: ./farmacia-service
    container_name: asilo-farmacia-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3001
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"
    restart: unless-stopped

  pacientes-service:
    build: ./pacientes-service
    container_name: asilo-pacientes-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3002
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      # Fire-and-forget al crear una solicitud. Si el servicio no responde,
      # la solicitud se crea igual y el error queda en el log.
      NOTIFICACIONES_URL: http://notificaciones-service:3006
    ports:
      - "3002:3002"
    restart: unless-stopped

  laboratorio-service:
    build: ./laboratorio-service
    container_name: asilo-laboratorio-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3003
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      DESCUENTO_FUNDACION: "0.20"
    ports:
      - "3003:3003"
    restart: unless-stopped

  financiero-service:
    build: ./financiero-service
    container_name: asilo-financiero-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3004
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      UMBRAL_ALERTA_SALDO: "1000"
    ports:
      - "3004:3004"
    restart: unless-stopped

  reportes-service:
    build: ./reportes-service
    container_name: asilo-reportes-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3005
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3005:3005"
    restart: unless-stopped

  notificaciones-service:
    build: ./notificaciones-service
    container_name: asilo-notificaciones-service
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3006
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_NAME: AsiloCabezaAlgodon
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_API_URL: https://api.brevo.com/v3/smtp/email
      REMITENTE_EMAIL: ${REMITENTE_EMAIL:-notificaciones@asilo.gt}
      REMITENTE_NOMBRE: "Asilo Cabeza de Algodon"
      # true = no llama a Brevo, guarda como enviada. Util en dev.
      MODO_SIMULACION: ${MODO_SIMULACION:-true}
      # Reintentos automaticos de notificaciones fallidas
      NOTIF_MAX_INTENTOS: ${NOTIF_MAX_INTENTOS:-3}
      NOTIF_ESPERA_BASE_SEG: ${NOTIF_ESPERA_BASE_SEG:-30}
      NOTIF_ESPERA_MAX_SEG: ${NOTIF_ESPERA_MAX_SEG:-300}
      NOTIF_INTERVALO_JOB_SEG: ${NOTIF_INTERVALO_JOB_SEG:-30}
    ports:
      - "3006:3006"
    restart: unless-stopped

  # Frontend estatico (HTML/CSS/JS plano) servido por nginx.
  # No necesita depends_on: el navegador llama a los microservicios por su
  # puerto publicado, no a traves de la red interna de compose.
  frontend:
    build: ./frontend
    container_name: asilo-frontend
    ports:
      - "8090:80"
    restart: unless-stopped

volumes:
  sqlserver-data:
