server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: los servicios se resuelven al momento de cada
    # peticion (nginx arranca aunque algun servicio todavia no este arriba).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy hacia los microservicios (caso 24). La pagina llama a
    # /svc/<servicio>/... en el mismo origen y nginx reenvia la IP real del
    # cliente: X-Real-IP y X-Forwarded-For (lo que traia + $remote_addr al
    # final). Los servicios solo confian en este nginx (trust proxy), asi
    # que la auditoria guarda la IP del navegador, no la del gateway.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 10m;

    location /svc/auth/ {
        set $destino http://auth-service:3000;
        rewrite ^/svc/auth/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/farmacia/ {
        set $destino http://farmacia-service:3001;
        rewrite ^/svc/farmacia/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/pacientes/ {
        set $destino http://pacientes-service:3002;
        rewrite ^/svc/pacientes/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/laboratorio/ {
        set $destino http://laboratorio-service:3003;
        rewrite ^/svc/laboratorio/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/financiero/ {
        set $destino http://financiero-service:3004;
        rewrite ^/svc/financiero/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/reportes/ {
        set $destino http://reportes-service:3005;
        rewrite ^/svc/reportes/(.*)$ /$1 break;
        proxy_pass $destino;
    }
    location /svc/notificaciones/ {
        set $destino http://notificaciones-service:3006;
        rewrite ^/svc/notificaciones/(.*)$ /$1 break;
        proxy_pass $destino;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea para que un redeploy se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # styles.css y app.js no llevan hash en el nombre: sin esta cabecera el
    # navegador los cachea por heuristica y tras un redeploy mezcla HTML
    # nuevo con CSS/JS viejos. no-cache = revalida con ETag (304 si no cambio).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
