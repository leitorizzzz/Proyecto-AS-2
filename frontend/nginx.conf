server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La pagina llama a los microservicios directamente desde el navegador
    # (puertos 3000/3001/3002 del mismo host), asi que aqui no hay proxy.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML no se cachea para que un redeploy se vea de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # styles.css y app.js no llevan hash en el nombre: sin esta cabecera el
    # navegador los cachea por heuristica y tras un redeploy mezcla HTML
    # nuevo con CSS/JS viejos. no-cache = revalida con ETag (304 si no cambio).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
